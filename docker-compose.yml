services:
  codex-proxy:
    build: .
    container_name: codex-openai-proxy
    ports:
      - "7391:3033"
    environment:
      - PROXY_AUTH_DIR=/data
    volumes:
      - ${PROXY_AUTH_VOLUME:-codex-proxy-data}:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3033/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  codex-proxy-data:
